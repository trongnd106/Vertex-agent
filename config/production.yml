# Production configuration
environment: production
deployment:
  server_host: "0.0.0.0"
  server_port: 8000
  log_level: WARNING
  max_concurrency: 25
  workspace_dir: /app/workspace
agent:
  model: "${AGENT_MODEL}"
  max_iterations: 100
  middleware: "security,tool_injection,summarization,progress,rubric,audit"
database:
  url: "${DATABASE_URL}"
  pool_size: 20
  vector_dim: 1536